server {
    listen 80;
    server_name cinema.dshinee.site;

    charset utf-8;
    charset_types text/html text/css text/javascript application/javascript application/json text/xml application/xml;

    client_max_body_size 110M;

    # Chuyen tiep toi ung dung Spring Boot
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Force UTF-8 cho HTML responses
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Cache cho tai nguyen tinh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
