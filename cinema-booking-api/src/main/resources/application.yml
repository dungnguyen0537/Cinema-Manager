server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  application:
    name: cinema-booking-api




  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema_booking}
    username: ${DB_USERNAME:cinema_user}
    password: ${DB_PASSWORD:cinema_pass_2024}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yQ2luZW1hQm9va2luZ1N5c3RlbTIwMjQ=}
    access-token-expiration: 3600000      # 1 hour
    refresh-token-expiration: 604800000   # 7 days

  # MB Bank (dvsteam.vn) Configuration
  payment:
    mbbank:
      token: ${MBBANK_API_TOKEN:d10b28d223e240bed1ea3d9ebf594b35}
      account-number: ${MBBANK_ACCOUNT_NUMBER:83865888888}
      account-name: ${MBBANK_ACCOUNT_NAME:NGUYEN VAN DUNG}

  # Booking Configuration
  booking:
    hold-duration-minutes: 10
    payment-timeout-minutes: 15

  # CORS
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Logging
logging:
  level:
    com.cinema: INFO
    com.cinema.payment: DEBUG
    org.springframework.security: WARN
    org.springframework.jdbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator (for Docker healthcheck)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

