<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Cinema 8 Star — Hệ thống quản trị rạp chiếu phim hiện đại">
    <meta name="author" content="Cinema 8 Star">
    <meta name="theme-color" content="#0a0a0c">
    <title>Admin — Cinema 8 Star</title>
    <link rel="icon" type="image/jpeg" href="/cinema.jpg">
    <link rel="apple-touch-icon" href="/cinema.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css?v=32">
</head>
<body data-theme="dark">
    <!-- Login Screen -->
    <div class="admin-login" id="admin-login">
        <div class="login-box">
            <div class="login-brand">
                <img src="/cinema.jpg" alt="Cinema 8 Star Logo" class="logo-img">
                Cinema 8<span>Star</span>
            </div>
            <p class="login-subtitle">Đăng nhập quản trị hệ thống</p>
            <form id="login-form" onsubmit="handleAdminLogin(event)">
                <div class="field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="admin@cinema.vn" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary btn-full" id="login-btn">Đăng nhập</button>
                <p class="login-error hidden" id="login-error"></p>
            </form>
        </div>
    </div>

    <!-- Admin Shell -->
    <div class="admin-shell hidden" id="admin-shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="/admin">
                    <img src="/cinema.jpg" alt="Cinema 8 Star Logo" class="logo-img">
                    Cinema 8<span>Star</span>
                </a>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Tổng quan
                </a>
                <a href="#movies" class="nav-item" data-page="movies">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
                    Phim
                </a>
                <a href="#cinemas" class="nav-item" data-page="cinemas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Rạp chiếu
                </a>
                <a href="#showtimes" class="nav-item" data-page="showtimes">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Lịch chiếu
                </a>
                <a href="#bookings" class="nav-item" data-page="bookings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                    Đặt vé
                </a>
                <a href="#users" class="nav-item" data-page="users">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Người dùng
                </a>
                <a href="#promotions" class="nav-item" data-page="promotions">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 12H16c-.7 2-2 3-4 3s-3.3-1-4-3H2.5"/><path d="M5.5 5.1L2 12v6c0 1.1.9 2 2 2h16a2 2 0 002-2v-6l-3.4-6.9A2 2 0 0016.8 4H7.2a2 2 0 00-1.8 1.1z"/></svg>
                    Khuyến mãi
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/" class="nav-item nav-item-dim">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Về trang chủ
                </a>
            </div>
        </aside>

        <!-- Main -->
        <div class="main-area">
            <!-- Header -->
            <header class="topbar">
                <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-title" id="topbar-title">Tổng quan</div>
                <div class="topbar-right">
                    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện">
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <span class="topbar-user" id="topbar-user">Admin</span>
                    <button class="btn-ghost btn-sm" onclick="adminLogout()">Đăng xuất</button>
                </div>
            </header>

            <!-- Content -->
            <main class="content" id="content">
                <!-- Rendered by JS -->
            </main>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container"></div>

    <!-- Modal container -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-box" id="modal-box"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/js/api.js?v=32"></script>
    <script src="/js/admin/dashboard.js?v=32"></script>
    <script src="/js/admin/movies.js?v=32"></script>
    <script src="/js/admin/cinemas.js?v=32"></script>
    <script src="/js/admin/showtimes.js?v=32"></script>
    <script src="/js/admin/promotions.js?v=32"></script>
    <script src="/js/admin/bookings.js?v=32"></script>
    <script src="/js/admin/users.js?v=32"></script>
    <script src="/js/admin/reports.js?v=32"></script>
    <script src="/js/admin/admin-app.js?v=32"></script>
</body>
</html>
